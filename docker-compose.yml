services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medislot
      MYSQL_USER: medislot
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting MySQL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting MySQL}
    ports:
      - "3306:3306"
    volumes:
      - medislot-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  medislot-mysql:
